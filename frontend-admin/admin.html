<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>BẢNG ĐIỀU KHIỂN - IN BAN MÊ</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        brand: { yellow: '#FACC15', hover: '#EAB308', dark: '#121212', card: '#1E1E1E', border: '#2E2E2E' }
                    },
                    fontFamily: { sans: ['Inter', 'sans-serif'] }
                }
            }
        }
    </script>
</head>
<body class="bg-brand-dark text-gray-200 font-sans min-h-screen p-4 sm:p-8">

    <div class="max-w-7xl mx-auto space-y-8">
        <!-- Header Admin -->
        <div class="flex flex-col sm:flex-row justify-between items-start sm:items-center gap-4 pb-6 border-b border-brand-border">
            <div>
                <span class="text-xs font-bold text-brand-yellow uppercase tracking-widest">HỆ THỐNG QUẢN TRỊ</span>
                <h1 class="text-2xl font-black text-white uppercase mt-1">BẢNG ĐIỀU KHIỂN XƯỞNG IN BAN MÊ</h1>
            </div>
            <button onclick="openModal()" class="bg-brand-yellow hover:bg-brand-hover text-brand-dark font-extrabold text-sm px-5 py-3 rounded-xl shadow-lg transition flex items-center">
                <i class="fas fa-plus mr-2"></i> Thêm Sản Phẩm Mới
            </button>
        </div>

        <!-- Danh Sách Sản Phẩm -->
        <div class="bg-brand-card border border-brand-border rounded-2xl p-6">
            <h2 class="text-lg font-bold text-white mb-4">Danh Sách Sản Phẩm Dịch Vụ</h2>
            <div id="product-list" class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-4">
                <div class="col-span-full text-center py-8 text-gray-500">
                    <i class="fas fa-spinner fa-spin text-2xl text-brand-yellow mb-2"></i>
                    <p>Đang tải danh sách sản phẩm...</p>
                </div>
            </div>
        </div>
    </div>

    <!-- MODAL THÊM SẢN PHẨM -->
    <div id="product-modal" class="fixed inset-0 z-50 bg-black/80 backdrop-blur-sm flex items-center justify-center p-4 hidden">
        <div class="bg-brand-card border border-brand-border w-full max-w-md rounded-2xl shadow-2xl p-6 relative">
            <div class="flex justify-between items-center mb-6">
                <h3 class="text-lg font-bold text-white">Thêm Sản Phẩm Dịch Vụ</h3>
                <button onclick="closeModal()" class="text-gray-400 hover:text-white text-lg">
                    <i class="fas fa-times"></i>
                </button>
            </div>

            <form id="product-form" onsubmit="handleAddProduct(event)" class="space-y-4">
                <div>
                    <label class="block text-xs font-bold uppercase text-gray-300 mb-1">Tên sản phẩm *</label>
                    <input type="text" id="p-title" required placeholder="In NameCard / Danh thiếp theo yêu cầu" class="w-full bg-brand-dark border border-brand-border text-white rounded-xl px-4 py-2.5 text-sm focus:outline-none focus:border-brand-yellow">
                </div>

                <div class="grid grid-cols-2 gap-3">
                    <div>
                        <label class="block text-xs font-bold uppercase text-gray-300 mb-1">Danh mục *</label>
                        <select id="p-category" required class="w-full bg-brand-dark border border-brand-border text-white rounded-xl px-3 py-2.5 text-sm focus:outline-none focus:border-brand-yellow">
                            <option value="In Namecard">In Namecard</option>
                            <option value="In Ly Nhựa">In Ly Nhựa</option>
                            <option value="In Bao Bì">In Bao Bì</option>
                            <option value="In Tem Nhãn">In Tem Nhãn</option>
                            <option value="Dịch vụ khác">Dịch vụ khác</option>
                        </select>
                    </div>
                    <div>
                        <label class="block text-xs font-bold uppercase text-gray-300 mb-1">Ghi chú giá *</label>
                        <input type="text" id="p-price" required placeholder="69.000đ/hộp" class="w-full bg-brand-dark border border-brand-border text-white rounded-xl px-4 py-2.5 text-sm focus:outline-none focus:border-brand-yellow">
                    </div>
                </div>

                <div>
                    <label class="block text-xs font-bold uppercase text-gray-300 mb-1">Hình ảnh sản phẩm *</label>
                    <input type="file" id="p-image" accept="image/*" class="w-full bg-brand-dark border border-brand-border text-gray-300 text-xs rounded-xl p-2 focus:outline-none file:mr-3 file:py-1.5 file:px-3 file:rounded-lg file:border-0 file:text-xs file:font-bold file:bg-brand-yellow file:text-brand-dark hover:file:bg-brand-hover">
                </div>

                <div>
                    <label class="block text-xs font-bold uppercase text-gray-300 mb-1">Mô tả chi tiết *</label>
                    <textarea id="p-desc" rows="3" required placeholder="Nhập chi tiết về quy cách in, chất liệu..." class="w-full bg-brand-dark border border-brand-border text-white rounded-xl px-4 py-2.5 text-sm focus:outline-none focus:border-brand-yellow"></textarea>
                </div>

                <div class="flex justify-end gap-3 pt-3">
                    <button type="button" onclick="closeModal()" class="px-5 py-2.5 rounded-xl text-xs font-bold text-gray-400 hover:bg-brand-dark">Hủy</button>
                    <button type="submit" id="save-btn" class="bg-brand-yellow hover:bg-brand-hover text-brand-dark font-extrabold text-xs px-6 py-2.5 rounded-xl shadow transition">
                        Lưu Sản Phẩm
                    </button>
                </div>
            </form>
        </div>
    </div>

    <!-- Toast Notification -->
    <div id="toast-container" class="fixed bottom-5 right-5 z-50 flex flex-col gap-2 pointer-events-none"></div>

    <script>
        const API_BASE = 'https://in-ban-me.onrender.com/api';

        document.addEventListener('DOMContentLoaded', loadAdminProducts);

        async function loadAdminProducts() {
            try {
                const res = await fetch(`${API_BASE}/products`);
                const data = await res.json();

                const container = document.getElementById('product-list');
                if (data.success && data.data.length > 0) {
                    container.innerHTML = data.data.map(p => {
                        let img = p.images && p.images.length > 0 ? p.images[0] : (p.imageUrl || '');
                        if (img.startsWith('/uploads')) img = `https://in-ban-me.onrender.com${img}`;
                        if (!img) img = 'https://via.placeholder.com/300x200?text=No+Image';

                        return `
                            <div class="bg-brand-dark border border-brand-border rounded-xl p-4 flex gap-4 items-center justify-between">
                                <img src="${img}" class="w-16 h-16 object-cover rounded-lg border border-brand-border shrink-0">
                                <div class="flex-1 min-w-0">
                                    <h4 class="font-bold text-white text-sm truncate">${p.title}</h4>
                                    <p class="text-xs text-brand-yellow font-semibold mt-0.5">${p.priceNote || ''}</p>
                                    <p class="text-[11px] text-gray-400 truncate mt-1">${p.desc || ''}</p>
                                </div>
                                <button onclick="deleteProduct('${p._id}')" class="text-red-400 hover:text-red-300 p-2 text-sm">
                                    <i class="fas fa-trash"></i>
                                </button>
                            </div>
                        `;
                    }).join('');
                } else {
                    container.innerHTML = `<p class="col-span-full text-center text-gray-500 py-8">Chưa có sản phẩm nào.</p>`;
                }
            } catch (err) {
                showToast('Không thể kết nối máy chủ', 'error');
            }
        }

        // THÊM SẢN PHẨM MỚI (Dùng FormData hỗ trợ File Upload)
        async function handleAddProduct(e) {
            e.preventDefault();

            const btn = document.getElementById('save-btn');
            const originalText = btn.innerText;
            btn.innerText = 'Đang lưu...';
            btn.disabled = true;

            const formData = new FormData();
            formData.append('title', document.getElementById('p-title').value);
            formData.append('category', document.getElementById('p-category').value);
            formData.append('priceNote', document.getElementById('p-price').value);
            formData.append('desc', document.getElementById('p-desc').value);

            const fileInput = document.getElementById('p-image');
            if (fileInput.files.length > 0) {
                formData.append('image', fileInput.files[0]);
            }

            try {
                const res = await fetch(`${API_BASE}/products`, {
                    method: 'POST',
                    body: formData
                });

                const data = await res.json();

                if (res.ok && data.success) {
                    showToast('Thêm sản phẩm thành công!', 'success');
                    closeModal();
                    document.getElementById('product-form').reset();
                    loadAdminProducts();
                } else {
                    showToast(data.message || 'Lỗi thêm sản phẩm', 'error');
                }
            } catch (err) {
                console.error(err);
                showToast('Không thể kết nối máy chủ!', 'error');
            } finally {
                btn.innerText = originalText;
                btn.disabled = false;
            }
        }

        async function deleteProduct(id) {
            if (!confirm('Bạn có chắc muốn xóa sản phẩm này?')) return;
            try {
                const res = await fetch(`${API_BASE}/products/${id}`, { method: 'DELETE' });
                const data = await res.json();
                if (data.success) {
                    showToast('Đã xóa sản phẩm', 'success');
                    loadAdminProducts();
                }
            } catch (err) {
                showToast('Lỗi xóa sản phẩm', 'error');
            }
        }

        function openModal() {
            document.getElementById('product-modal').classList.remove('hidden');
        }

        function closeModal() {
            document.getElementById('product-modal').classList.add('hidden');
        }

        function showToast(message, type = 'success') {
            const container = document.getElementById('toast-container');
            const toast = document.createElement('div');
            toast.className = `${type === 'success' ? 'bg-emerald-600' : 'bg-red-600'} text-white px-5 py-3 rounded-xl shadow-2xl text-sm font-semibold transition-all pointer-events-auto`;
            toast.innerHTML = message;
            container.appendChild(toast);
            setTimeout(() => toast.remove(), 3500);
        }
    </script>
</body>
</html>
